<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title description">
<title id="title">Synthetic call-put implied-volatility spreads</title>
<desc id="description">Ten fictional option pairs. Bars show call implied volatility minus put implied volatility; whiskers show a quote-width sensitivity interval.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Arial,sans-serif;fill:#17202a}.small{font-size:13px}.label{font-size:15px}.head{font-size:19px;font-weight:700}</style>
<text x="40" y="42" class="head">Fictional option pairs - CPIV = call IV minus put IV</text>
<text x="40" y="69" class="small">Bars: point value; whiskers: quote-width
 sensitivity, not a confidence interval</text>
<line x1="520.00" y1="100" x2="520.00" y2="526" stroke="#536273" stroke-width="2"/>
<text x="40" y="115" class="label">SIM01</text>
<line x1="262.29" y1="110" x2="303.74" y2="110" stroke="#34495e" stroke-width="2"/>
<line x1="262.29" y1="105" x2="262.29" y2="115" stroke="#34495e" stroke-width="2"/>
<line x1="303.74" y1="105" x2="303.74" y2="115" stroke="#34495e" stroke-width="2"/>
<line x1="520.00" y1="110" x2="283.01" y2="110" stroke="#bf4b43" stroke-width="9" stroke-linecap="round"/>
<text x="900" y="115" class="small">-4.00 pp</text>
