[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bounding-the-invisible"
version = "0.1.0"
description = "Evidence-first research tools for liquidation-surface identifiability"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pydantic>=2.8",
  "polars>=1.0",
  "pyarrow>=17.0",
  "duckdb>=1.0",
  "httpx>=0.27",
  "websockets>=13.0",
  "apscheduler>=3.10",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pymupdf>=1.24",
  "pycryptodome>=3.20",
  "playwright>=1.45",
  "hypothesis>=6.112",
  "ruff>=0.6",
  "mypy>=1.13",
  "import-linter>=2.1",
  "pre-commit>=3.8",
]
notebook = [
  "jupyter>=1.1",
  "nbclient>=0.10",
  "matplotlib==3.10.8",
]
site = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "pymdown-extensions>=10.12",
  "markdown-it-py>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bti"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "scripts", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/bti/viz/widgets/w1_identifiability.py" = ["E501"]
# The embedded Markdown prose is intentionally kept as complete paragraphs.
"scripts/export_submission_manuscript.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["bti.bounds.*"]
strict = true

[tool.uv]
default-groups = ["dev", "notebook", "site"]
